<h2>Управление администраторами</h2>

<div *ngIf="loading">Загрузка...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<table *ngIf="!loading && !error" border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr><th>ID</th><th>Логин</th><th>Активен</th><th>Дата рождения</th><th>Создан</th></tr>
    </thead>
    <tbody>
    <tr *ngFor="let admin of admins">
        <td>{{ admin.admin_id }}</td>
        <td>{{ admin.admin_login }}</td>
        <td>{{ admin.is_active_admin ? 'Да' : 'Нет' }}</td>
        <td>{{ admin.admin_birth_date || '—' }}</td>
        <td>{{ admin.created_at | date:'dd.MM.yyyy' }}</td>
    </tr>
    </tbody>
</table>
